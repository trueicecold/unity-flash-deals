# Refreshes deals.json and publishes the site to GitHub Pages.
name: Update flash deals

on:
  schedule:
    - cron: '20 */3 * * *'   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-deals.mjs
      - run: mkdir _site && cp index.html deals.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploying in a separate job gives GitHub time to register the uploaded
  # artifact; deploying in the same job can fail with "Found 0 artifact(s)".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

